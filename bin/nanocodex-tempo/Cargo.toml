[package]
name = "nanocodex-tempo-bin"
workspace = "../tempo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Tempo-enabled Nanocodex TUI and headless JSONL adapter"
build = "../nanocodex/build.rs"

# This package compiles the canonical CLI source with the payment modules
# enabled; there is no second CLI implementation to drift.

[package.metadata.cargo-machete]
ignored = ["chrono", "vergen"]

[dependencies]
arboard.workspace = true
async-trait.workspace = true
alloy-primitives.workspace = true
base64.workspace = true
clap.workspace = true
crossterm.workspace = true
dotenvy.workspace = true
eyre.workspace = true
fs2.workspace = true
futures-util.workspace = true
hex.workspace = true
http-body-util.workspace = true
hudsucker.workspace = true
image.workspace = true
mpp = { workspace = true, features = ["client", "tempo", "reqwest-rustls-tls"] }
nanocodex.workspace = true
nanocodex-observability.workspace = true
nanocodex-vm.workspace = true
nanousd.workspace = true
nix.workspace = true
pulldown-cmark.workspace = true
rand.workspace = true
ratatui.workspace = true
reqwest = { workspace = true, features = ["blocking", "stream"] }
self-replace.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
shlex.workspace = true
syntect.workspace = true
tempfile.workspace = true
tempo-alloy.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml.workspace = true
tracing.workspace = true
two-face.workspace = true
unicode-segmentation.workspace = true
unicode-width.workspace = true

[build-dependencies]
chrono.workspace = true
vergen = { workspace = true, features = ["build", "git", "gitcl"] }

[dev-dependencies]
axum.workspace = true
nanocodex-tools.workspace = true
reqwest = { workspace = true, features = ["query"] }
tokio-tungstenite.workspace = true
tracing-subscriber.workspace = true

[[bin]]
name = "nanocodex"
path = "../nanocodex/src/main.rs"
doc = false

[lints]
workspace = true
