[package]
name = "nanocodex-bin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Daily-driver TUI and headless JSONL adapter for Nanocodex"
build = "build.rs"

[package.metadata.cargo-machete]
# cargo-machete does not resolve imports from the package build script.
ignored = ["chrono", "vergen"]

[features]
default = []
harbor-evals = []
# Keep paid-provider composition out of the direct-agent development graph.
tempo = [
    "dep:alloy-primitives",
    "dep:mpp",
    "dep:nanocodex-egress",
    "dep:nanousd",
    "dep:rand",
    "dep:tempo-alloy",
]

[dependencies]
arboard.workspace = true
async-trait.workspace = true
alloy-primitives = { workspace = true, optional = true }
axum.workspace = true
base64.workspace = true
chrono.workspace = true
clap.workspace = true
dotenvy.workspace = true
eyre.workspace = true
flate2.workspace = true
fs2.workspace = true
futures-util.workspace = true
hex.workspace = true
jsonschema.workspace = true
miette = { version = "7.6.0", features = ["fancy"] }
nanocodex.workspace = true
nanocodex-browser.workspace = true
nanocodex-observability.workspace = true
nix.workspace = true
nanousd = { workspace = true, optional = true }
png = "0.18.1"
mpp = { workspace = true, optional = true, features = ["middleware", "tempo", "reqwest-rustls-tls-no-provider"] }
nanocodex-egress = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
rayon = "1.12.0"
reqwest = { workspace = true, features = ["blocking", "stream"] }
rusqlite.workspace = true
self-replace.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9.34"
syntect.workspace = true
tar.workspace = true
sha2.workspace = true
shlex.workspace = true
tempfile.workspace = true
thiserror.workspace = true
toml.workspace = true
tokio = { workspace = true, features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { workspace = true, features = ["rt"] }
toml_edit = "0.25.13"
tempo-alloy = { workspace = true, optional = true }
tracing.workspace = true
unicode-segmentation.workspace = true
unicode-width.workspace = true
url.workspace = true
yansi.workspace = true
zeroize.workspace = true
zstd.workspace = true

# Keep Tact's rendering stack at the reviewed upstream versions.
tact-crossterm = { package = "crossterm", version = "0.29.0", features = ["event-stream", "osc52"] }
tact-pulldown-cmark = { package = "pulldown-cmark", version = "0.13.4", default-features = false }
tact-ratatui = { package = "ratatui", version = "0.30.2" }
tact-sha2 = { package = "sha2", version = "0.10.9" }

[target.'cfg(any(all(target_os = "linux", not(target_env = "musl")), all(target_os = "macos", target_arch = "aarch64")))'.dependencies]
arcbox-ext4.workspace = true
ignore.workspace = true
nanocodex-eval.workspace = true
nanocodex-vm.workspace = true
regex.workspace = true
sysinfo.workspace = true
uuid.workspace = true

[build-dependencies]
chrono.workspace = true
vergen = { workspace = true, features = ["build", "git", "gitcl"] }

[dev-dependencies]
criterion.workspace = true
nanocodex-tools.workspace = true
reqwest = { workspace = true, features = ["query"] }
rustls.workspace = true
tokio-tungstenite.workspace = true
tower.workspace = true
tracing-subscriber.workspace = true

[[bench]]
name = "tui_render"
path = "src/tui/bench.rs"
harness = false

[[bin]]
name = "nanocodex"
path = "src/main.rs"
doc = false
bench = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
# Preserve the reviewed Tact source style; Nanocodex still denies every other
# warning in CI.
missing-const-for-fn = "allow"
redundant-clone = "allow"
use-self = "allow"
large-enum-variant = "allow"
result-large-err = "allow"
