# Cargo resolves optional git dependencies even when their feature is disabled.
# Keep the payment graph in a separate lockfile so direct Nanocodex builds never
# need the Tempo, MPP, Alloy, or proxy sources.
[workspace]
members = [
    "../nanocodex-tempo",
    "../nanousd",
    "../nanousd-api",
]
default-members = ["../nanocodex-tempo"]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.97"
authors = ["Nanocodex Contributors"]
license = "MIT OR Apache-2.0"
homepage = "https://github.com/gakonst/nanocodex"
repository = "https://github.com/gakonst/nanocodex"
publish = false

[workspace.dependencies]
alloy = { version = "2.1.0", default-features = false, features = ["contract", "provider-http", "reqwest", "reqwest-rustls-tls", "rpc-types", "sol-types", "std"] }
alloy-primitives = { version = "1.6.1", default-features = false, features = ["std"] }
arboard = "3"
async-trait = "=0.1.89"
axum = { version = "0.8.9", default-features = false, features = ["form", "http1", "json", "query", "tokio"] }
base64 = "0.22.1"
chrono = { version = "0.4.43", default-features = false, features = ["clock", "std", "wasmbind"] }
clap = { version = "4.5.54", features = ["derive", "env"] }
crossterm = { version = "0.28.1", features = ["bracketed-paste", "event-stream"] }
dotenvy = "0.15.7"
eyre = "0.6.12"
fs2 = "0.4"
futures-util = { version = "0.3.31", default-features = false, features = ["async-await", "sink", "std"] }
getrandom = "0.4.3"
hex = "0.4.3"
hmac = "0.13.0"
http-body-util = "0.1.3"
hudsucker = { version = "0.25.0", git = "https://github.com/gakonst/hudsucker", rev = "0c7da328e446518036b9420db3e75451fca522e9", default-features = false, features = ["rcgen-ca", "rustls-client"] }
image = { version = "0.25.9", default-features = false, features = ["bmp", "gif", "jpeg", "png", "pnm", "webp"] }
mpp = { version = "=0.11.0", git = "https://github.com/tempoxyz/mpp-rs", rev = "5caad442edeab796821b7f3bb009ab6945106e35", default-features = false }
nanocodex = { version = "0.3.0", path = "../../crates/nanocodex" }
nanocodex-observability = { version = "0.3.0", path = "../../crates/nanocodex-observability" }
nanocodex-tools = { version = "0.3.0", path = "../../crates/nanocodex-tools" }
nanocodex-vm = { version = "0.3.0", path = "../../crates/experimental/nanocodex-vm" }
nanousd = { version = "0.3.0", path = "../nanousd" }
nix = { version = "0.31.3", default-features = false, features = ["process", "resource", "signal", "user"] }
pulldown-cmark = { version = "0.10", default-features = false }
rand = "0.9.2"
ratatui = { version = "0.29.0", features = ["unstable-rendered-line-info"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "0.38", features = ["bundled"] }
self-replace = "1.5.0"
semver = "1.0.27"
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = { version = "1.0.149", features = ["raw_value"] }
sha2 = { version = "0.11.0", default-features = false }
shlex = "2.0.1"
syntect = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }
tempfile = "3.27.0"
tempo-alloy = { version = "=1.10.1", git = "https://github.com/tempoxyz/tempo", rev = "9081cc65940c419ab60ebd1fd8170483ee49cfe1" }
thiserror = "2.0.17"
tokio = "1.48.0"
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
toml = "1.1.3"
tower = { version = "0.5.2", features = ["limit", "load-shed", "retry", "timeout", "util"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt", "json"] }
two-face = { version = "0.5.1", default-features = false, features = ["syntect-fancy"] }
unicode-segmentation = "1.13"
unicode-width = "0.2"
url = "2.5.7"
uuid = { version = "1", features = ["js", "serde", "v5", "v7"] }
vergen = { version = "8", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
missing-const-for-fn = "warn"
use-self = "warn"
redundant-clone = "warn"
large-enum-variant = "allow"
result-large-err = "allow"

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.release]
opt-level = 3
lto = "thin"
debug = "none"
strip = "symbols"
panic = "unwind"
codegen-units = 16

[profile.maxperf]
inherits = "release"
lto = "fat"
codegen-units = 1
