[package]
name = "nanocodex-computer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
readme = "README.md"
description = "Owned, observable native computer-use runtime for Nanocodex"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["-D", "warnings"]

[dependencies]
async-trait.workspace = true
base64.workspace = true
nanocodex-oai-api.workspace = true
nanocodex-tools.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "process", "rt", "sync", "time"] }
tracing.workspace = true
uuid.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
accessibility = "0.2.0"
accessibility-sys = "0.2.0"
core-foundation = "0.10.1"
core-graphics = { version = "0.25.0", features = ["elcapitan", "highsierra"] }
image.workspace = true
nanocodex-computer-macos = { version = "0.3.0", path = "macos" }
sha2.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
