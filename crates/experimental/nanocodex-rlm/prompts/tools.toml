spawn = "Call as tools.spawn_agent({ specification, task }). Starts one clean recursive subagent and returns its identity immediately without waiting for its answer."
list = "Call as tools.list_agents({ include_closed? }). Lists retained subagents in the caller's recursive task family."
send = "Call as tools.send_agent_message({ to, message }). Sends a bounded message to a retained subagent or, from a child, to its parent."
wait = "Call as tools.wait_agent({ agent_ids?, timeout_ms? }). Waits for selected subagent lifecycle changes or messages addressed to the caller."
interrupt = "Call as tools.interrupt_agent({ agent_id }). Interrupts active work for a retained subagent and its active descendants without deleting them."
close = "Call as tools.close_agent({ agent_id }). Closes a retained subagent and its descendant subtree and waits for cleanup."
harness_state = "Call as tools.harness_state({}). Reads the latest durable prompt notes, memories, skills, subagent specifications, and refinement history. Call this before selecting or changing reusable harness state."
harness_apply = "Call as tools.harness_apply({ trigger, edit }). Persists one evidence-backed CRUD edit to durable harness state. Revisions are monotonic, writes are atomic, and the previous document is archived."
harness_rollback = "Call as tools.harness_rollback({ revision, trigger }). Restores one archived harness revision as a new monotonic revision after observing a regression."
refine = "Call as tools.refine_harness({ observation }). Starts a clean background refiner that may apply at most one evidence-backed harness edit and returns its retained agent identity immediately."
