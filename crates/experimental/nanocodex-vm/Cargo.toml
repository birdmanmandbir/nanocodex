[package]
name = "nanocodex-vm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
description = "VM lifecycle, images, and retained workspace tools for Nanocodex"

[features]
default = ["host"]
host = [
    "dep:arcbox-ext4",
    "dep:async-trait",
    "dep:aws-nitro-enclaves-nsm-api",
    "dep:dcap-qvl",
    "dep:flate2",
    "dep:fs2",
    "dep:futures-util",
    "dep:ignore",
    "dep:krun",
    "dep:nix",
    "dep:oci-client",
    "dep:p384",
    "dep:reflink-copy",
    "dep:sev",
    "dep:serde_cbor",
    "dep:shlex",
    "dep:tar",
    "dep:tempfile",
    "dep:tracing",
    "dep:uuid",
    "dep:x509-parser",
    "dep:zstd",
    "nanocodex-tools/native",
]
guest-runtime = [
    "dep:aws-nitro-enclaves-nsm-api",
    "aws-nitro-enclaves-nsm-api/nix",
    "dep:nix",
    "nanocodex-tools/workspace-runtime",
]
# Dedicated host artifacts select exactly one libkrun TEE implementation. These
# features are intentionally not part of `host` or the ordinary workspace build.
libkrun-amd-sev = ["host", "krun/amd-sev", "krun/vfio"]
libkrun-intel-tdx = ["host", "krun/tdx", "krun/vfio"]

[dependencies]
base64.workspace = true
ed25519-dalek.workspace = true
filetime.workspace = true
getrandom.workspace = true
hex.workspace = true
nanocodex-tools = { path = "../../nanocodex-tools", version = "0.3.0", default-features = false }
nix = { workspace = true, optional = true, features = ["fs", "mount"] }
serde.workspace = true
serde_cbor = { workspace = true, optional = true }
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-std", "io-util", "macros", "process", "rt", "rt-multi-thread", "sync", "time"] }

aws-nitro-enclaves-nsm-api = { version = "0.5.2", optional = true, default-features = false }

[target.'cfg(any(all(target_os = "linux", not(target_env = "musl")), all(target_os = "macos", target_arch = "aarch64")))'.dependencies]
arcbox-ext4 = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
fs2 = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
ignore = { workspace = true, optional = true }
krun = { workspace = true, optional = true }
oci-client = { workspace = true, optional = true }
p384 = { workspace = true, optional = true }
dcap-qvl = { workspace = true, optional = true }
reflink-copy = { workspace = true, optional = true }
sev = { workspace = true, optional = true }
shlex = { workspace = true, optional = true }
tar = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
x509-parser = { workspace = true, optional = true }
zstd = { workspace = true, optional = true }

[dev-dependencies]
criterion.workspace = true
nix.workspace = true
reflink-copy.workspace = true
shlex.workspace = true
tempfile.workspace = true
tracing-subscriber.workspace = true

[[bin]]
name = "nanocodex-vm-guest"
path = "src/bin/nanocodex-vm-guest.rs"
doc = false
required-features = ["guest-runtime"]

[[example]]
name = "confidential_host"
required-features = ["host"]

[[example]]
name = "confidential_attestation"
required-features = ["host"]

[[example]]
name = "verify_snp_attestation"
required-features = ["host"]

[[example]]
name = "verify_tdx_attestation"
required-features = ["host"]

[[example]]
name = "verify_nitro_attestation"
required-features = ["host"]

[[bench]]
name = "image_cache"
harness = false
required-features = ["host"]

[[bench]]
name = "vm_session"
harness = false
required-features = ["host"]

[[test]]
name = "image_live_build"
path = "tests/image_live_build.rs"
required-features = ["host"]

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
missing-const-for-fn = "warn"
use-self = "warn"
redundant-clone = "warn"
large-enum-variant = "allow"
result-large-err = "allow"
