[package]
name = "nanocodex-voice"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
description = "Experimental desktop voice and meeting sessions for Nanocodex agents"
build = "build.rs"

[features]
default = []
meeting-mlx = ["dep:mlx-whisper-rs"]

[dependencies]
futures-util.workspace = true
nanocodex = { workspace = true, features = ["realtime"] }
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "process", "rt", "sync"] }
tracing.workspace = true
whoami.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
cpal.workspace = true

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
mlx-whisper-rs = { workspace = true, optional = true }

[lints]
workspace = true
