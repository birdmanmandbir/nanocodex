[package]
name = "nanocodex-browser"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Typed browser automation tool for Nanocodex Code Mode"
exclude = ["assets-src/node_modules/**"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["-D", "warnings"]

[dependencies]
async-trait.workspace = true
base64.workspace = true
chrono.workspace = true
chromiumoxide.workspace = true
futures-util.workspace = true
image.workspace = true
nanocodex-tools.workspace = true
reqwest = { workspace = true, features = ["stream"] }
rusqlite.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sourcemap.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "process", "rt", "sync", "time"] }
tracing.workspace = true
url.workspace = true
v8-heap-parser.workspace = true

[dev-dependencies]
eyre.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }

[lints]
workspace = true
