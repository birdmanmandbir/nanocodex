[package]
name = "nanocodex-oai-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Tower-native OpenAI Responses API and managed context for Nanocodex"

[features]
default = ["client"]
client = [
    "dep:base64",
    "dep:futures-util",
    "dep:http",
    "dep:image",
    "dep:js-sys",
    "dep:reqwest",
    "dep:rustls",
    "dep:sha1",
    "dep:tokio",
    "dep:tokio-tungstenite",
    "dep:tower",
    "dep:tracing",
    "dep:uuid",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:web-time",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["-D", "warnings"]

[dependencies]
async-trait.workspace = true
futures-util = { workspace = true, optional = true }
http = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
smallvec.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"], optional = true }
tower = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
web-time = { workspace = true, optional = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
base64 = { workspace = true, optional = true }
image = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
sha1 = { workspace = true, optional = true }
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "time"], optional = true }
tokio-tungstenite = { workspace = true, optional = true }

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
js-sys = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }

[dev-dependencies]
criterion.workspace = true
eyre.workspace = true
simd-json.workspace = true
sonic-rs.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[[bench]]
name = "fork_history"
harness = false

[[bench]]
name = "tower_responses"
harness = false
required-features = ["client"]

[lints]
workspace = true
